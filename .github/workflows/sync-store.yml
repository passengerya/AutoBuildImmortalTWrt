# 从 CloudRunFilesBuilder 的 release 同步 .run 文件到本仓库内嵌 store/run/ 目录
#
# 触发方式:
#   1. 定时: 每天 23:00 UTC(北京时间 7:00), 留出上游每日构建的完成时间
#   2. 手动: workflow_dispatch(可指定其它源仓库)
#
# 注意: 定时触发只会使用默认分支(master)上的 workflow 文件,
#       请把本文件合并到 master 分支后才会生效。

name: Sync Store

on:
  workflow_dispatch:
    inputs:
      builder_repo:
        description: '源仓库(owner/repo)'
        required: false
        default: 'passengerya/CloudRunFilesBuilder'
  schedule:
    # 23:00 UTC = 北京时间 7:00
    - cron: '0 23 * * *'

permissions:
  contents: write

concurrency:
  group: sync-store
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync run files
        env:
          BUILDER_REPO: ${{ inputs.builder_repo || 'passengerya/CloudRunFilesBuilder' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 store/sync_run_files.py

      - name: Commit and push
        env:
          BUILDER_REPO: ${{ inputs.builder_repo || 'passengerya/CloudRunFilesBuilder' }}
        run: |
          if [ -z "$(git status --porcelain store/ shell/)" ]; then
            echo "没有变化, 跳过提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/ shell/
          git commit -m "sync: 从 ${BUILDER_REPO} 同步 run 文件到内嵌 store ($(date -u +%F))" \
            -m "Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push
